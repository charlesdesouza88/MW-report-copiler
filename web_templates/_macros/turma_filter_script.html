{% macro turma_filter_script(row_selector, storage_key) %}
<script>
(function () {
  const rowSelector = {{ row_selector|tojson }};
  const storageKey = 'mw_turma_filter_' + {{ storage_key|tojson }};
  const params = new URLSearchParams(window.location.search);

  function rows() {
    return document.querySelectorAll(rowSelector);
  }

  function setActiveButton(turma) {
    document.querySelectorAll('.filter-btn').forEach(function (btn) {
      const match = (btn.dataset.turma || '') === (turma || '');
      btn.className = match
        ? 'btn btn-sm btn-primary filter-btn'
        : 'btn btn-sm btn-ghost filter-btn';
    });
  }

  function applyTurmaFilter(turma, syncUrl) {
    const code = turma || '';
    setActiveButton(code);
    rows().forEach(function (row) {
      row.style.display = (!code || row.dataset.turma === code) ? '' : 'none';
    });
    if (code) {
      sessionStorage.setItem(storageKey, code);
    } else {
      sessionStorage.removeItem(storageKey);
    }
    if (syncUrl) {
      const url = new URL(window.location.href);
      if (code) {
        url.searchParams.set('turma', code);
      } else {
        url.searchParams.delete('turma');
      }
      history.replaceState(null, '', url.pathname + url.search + url.hash);
    }
  }

  document.querySelectorAll('.filter-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      applyTurmaFilter(btn.dataset.turma || '', true);
    });
  });

  const initial = params.get('turma') || sessionStorage.getItem(storageKey) || '';
  if (initial) {
    applyTurmaFilter(initial, !params.get('turma'));
  }
})();
</script>
{% endmacro %}
