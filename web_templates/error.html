<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }} — Mister Wiz</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/brand.css') }}">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  font-family: var(--font); color: var(--text); background: #F7F3FA;
}
.box {
  width: min(460px, 100%); background: #fff; border-radius: 18px; overflow: hidden;
  box-shadow: 0 10px 40px rgba(45, 16, 64, 0.12); text-align: center;
}
.head { background: linear-gradient(100deg, #5A1A64 0%, #792D83 55%, #9B3FB0 100%); padding: 22px; }
.head img { height: 24px; width: auto; }
.body { padding: 28px 28px 30px; }
.code { font-size: 12px; font-weight: 700; letter-spacing: 2px; color: var(--purple); text-transform: uppercase; }
h1 { font-size: 22px; margin: 6px 0 10px; }
p { font-size: 14px; color: var(--purple-dk); line-height: 1.5; }
a.btn {
  display: inline-block; margin-top: 20px; padding: 10px 20px; border-radius: 10px;
  background: linear-gradient(100deg, var(--purple-dk), var(--purple)); color: #fff;
  text-decoration: none; font-weight: 700; font-size: 14px;
}
</style>
</head>
<body>
  <div class="box">
    <div class="head"><img src="{{ url_for('static', filename='img/logo-primary-white.png') }}" alt="Mister Wiz" width="190" height="24"></div>
    <div class="body">
      <div class="code">Erro {{ code }}</div>
      <h1>{{ title }}</h1>
      <p>{{ message }}</p>
      <a class="btn" href="{{ url_for('dashboard') }}">Voltar ao Dashboard</a>
    </div>
  </div>
</body>
</html>
