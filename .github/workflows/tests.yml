name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # same as the Dockerfile
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # The runner image ships Google Chrome, so the A4 print-layout tests run too.
      - name: pytest
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rfE --tb=short 2>&1 | tee pytest.log
      # Surface each failing test as an annotation, readable on the PR page and through the API.
      - name: Report failing tests
        if: failure()
        shell: bash
        run: grep -E '^(FAILED|ERROR) ' pytest.log | sed 's/^/::error title=pytest::/' || true
